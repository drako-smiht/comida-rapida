<!DOCTYPE html> 
<html lang="es"> 
    
<head> 
    
    <meta charset="UTF-8"> 
    
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0"> 
    
    <title>Registro de Usuario - Combo Completo</title> 
    
    <!-- Bootstrap --> 
     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet"> 
    
    <!-- CSS propio --> 
     
    <link rel="stylesheet" href="css/estilos.css"> 

</head> 

<body> 
    
    <!-- CONTENEDOR PRINCIPAL --> 
     
    <section class="registro"> 
        
        <div class="container"> 
            
            <div class="row justify-content-center"> 
                
                <div class="col-lg-8"> 
                    
                    <div class="card-registro"> 
                        
                        <!-- TÍTULO --> 
                         
                        <div class="text-center mb-4"> 
                            
                            <h1>🍔 Registro de Usuario</h1> 
                            
                            <p class="subtitulo"> 
                                Crea tu cuenta para disfrutar de nuestros 
                                productos, promociones y combos especiales. 
                            </p> 
                        
                        </div> 
                        
                        <!-- FORMULARIO --> 
                         
                        <form id="formularioRegistro"> 
                            
                            <div class="row"> 
                                
                                <!-- NOMBRE --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                    
                                    <label class="form-label"> 
                                        Nombre Completo 
                                    </label> 
                                    
                                    <input type="text" 
                                    class="form-control" 
                                    placeholder="Ingrese su nombre completo" 
                                    required> 
                                
                                </div> 
                                
                                <!-- DOCUMENTO --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                    
                                    <label class="form-label"> 
                                        Documento de Identificación 
                                    </label> 
                                    
                                    <input type="number" 
                                    class="form-control" 
                                    placeholder="Ingrese su documento" 
                                    required> 
                                
                                </div> 
                            
                            </div> 
                            
                            <div class="row"> 
                                
                                <!-- CORREO --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                    
                                    <label class="form-label"> 
                                        Correo Electrónico 
                                    </label> 
                                    
                                    <input type="email" 
                                    class="form-control" 
                                    placeholder="Ingrese su correo" 
                                    required> 
                                
                                </div> 
                                
                                <!-- USUARIO --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                    
                                    <label class="form-label"> 
                                        Usuario 
                                    </label> 
                                    
                                    <input type="text" 
                                    class="form-control" 
                                    placeholder="Cree un nombre de usuario" 
                                    required> 
                                
                                </div> 
                            
                            </div> 
                            
                            <div class="row"> 
                                
                                <!-- CONTRASEÑA --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                
                                    <label class="form-label"> 
                                        Contraseña 
                                    </label> 
                                    
                                    <input type="password" 
                                    class="form-control" 
                                    placeholder="Ingrese una contraseña" 
                                    required> 
                                
                                </div> 
                                
                                <!-- CONFIRMAR --> 
                                 
                                <div class="col-md-6 mb-3"> 
                                    
                                    <label class="form-label"> 
                                        Confirmar Contraseña 
                                    </label> 
                                    
                                    <input type="password" 
                                    class="form-control" 
                                    placeholder="Confirme la contraseña" 
                                    required> 
                                
                                </div> 
                            
                            </div> 
                            
                            <!-- CHECKBOX --> 
                             
                            <div class="form-check mb-4"> 
                                
                                <input class="form-check-input" 
                                type="checkbox" 
                                required> 
                                
                                <label class="form-check-label"> 
                                    Acepto los términos y condiciones de Combo Completo. 
                                </label> 
                            
                            </div> 
                            
                            <!-- BOTONES --> 
                             
                            <div class="d-grid gap-3"> 
                                
                                <button type="submit" class="btn btn-naranja"> 
                                    Registrarse 
                                </button> 
                                
                                <a href="contacto.html" 
                                class="btn btn-outline-light"> 
                                Volver a Contáctanos 
                            </a> 
                        
                        </div> 
                    
                    </form> 
                
                </div> 
            
            </div> 
        
        </div> 
    
    </div> 

</section> 

<!-- Bootstrap JS --> 
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 

</body> 

</html>
